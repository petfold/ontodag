<!DOCTYPE html>
<html lang="en">
  <head>
    <title>OntoDAG</title>
    <link rel="stylesheet" type="text/css" href="/static/styles.css">
  </head>
  <body>
    <!-- Modal for error messages -->
    <div id="errorModal" class="overlay">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h3>Error</h3>
        <p id="error-modal-body"></p>
      </div>
    </div>

    <div class="dag-container base-container">
      <form id="import-file-form" enctype="multipart/form-data">
        <button type="button" id="new-dag-button">New DAG</button>
        or
        <input type="file" id="file-input" name="file" />
        <button type="submit">Import File</button>
        Export
        <button type="button" id="export-dag-button">OWL</button>
        <button type="button" id="export-dag-omn-button">OMN</button>
        <button type="button" id="export-dag-dot-button">DOT</button>
        <button type="button" id="export-dag-tex-button">TEX</button>
      </form>
      <form id="add-item-form">
        <input type="text" id="subcategory" placeholder="Subcategories (comma-separated)" size="30"/>
        <input type="text" id="super-categories" placeholder="Super-categories (comma-separated)" size="34"/>
        <button type="submit">Add Item</button>
        <button type="button" id="remove-item-button" title="Remove the item; its children reattach to its parents">Remove Item</button>
        <button type="button" id="delete-cone-button" title="Delete the item AND whatever only existed under it">Delete + Contents</button>
      </form>
      <form id="move-item-form">
        <input type="text" id="move-to" placeholder="Move to (comma-separated)" size="30"/>
        <input type="text" id="move-from" placeholder="out of (blank = all of them)" size="34"/>
        <button type="submit" title="Reclassify the items named above: file them under `to`, retract `out of`">Move Item</button>
      </form>
      <form id="declare-form">
        <button type="button" id="prelude-button" title="Declare the standard dimensions (weight, time, size, ...) — typed values like weight(3kg) need this first">Declare dimensions</button>
        <select id="pack-select"><option value="">unit pack…</option></select>
        <button type="button" id="pack-button" title="Merge a unit vocabulary pack (currencies and the like) into this DAG">Adopt pack</button>
      </form>
      <form id="ask-form">
        <input type="text" id="below-sub" placeholder="does this…" size="18"/>
        <input type="text" id="below-sup" placeholder="…fit within this?" size="20"/>
        <button type="button" id="below-button">Below?</button>
        <input type="text" id="canon-term" placeholder="canonical form of…" size="20"/>
        <button type="button" id="canon-button" title="What would this spelling actually store? (this page shows canonical names)">Canon</button>
      </form>
      <p id="notice" class="notice" style="display: none;"></p>
      <img id="dag-image" class="dag-visual" src="/dag/image" alt="DAG Visualization" />
      <div id="dag"></div>
    </div>
    <div class="query-container base-container">
      <form id="query-form">
        <input type="text" id="query-categories" placeholder="Super-categories (comma-separated)" size="50"/>
        <button type="submit">Query</button>
      </form>
      <form id="query-import-file-form" enctype="multipart/form-data">
       <input type="file" id="query-file-input" name="file" />
        <button type="submit">Import File</button>
        Export
        <label title="Also include the categories the answers hang from, so the file merges into a store that shares them"><input type="checkbox" id="export-with-context"/> with context</label>
        <button type="button" id="export-query-dag-button">OWL</button>
        <button type="button" id="export-query-dag-omn-button">OMN</button>
        <button type="button" id="export-query-dag-dot-button">DOT</button>
        <button type="button" id="export-query-dag-tex-button">TEX</button>
      </form>
      <img id="dag-query-image" class="dag-visual" alt="DAG Visualization" style="display: none;"/>
      <div id="dag-query"></div>
    </div>
    <!-- Hidden image overlay for full-size image -->
    <div id="image-overlay" class="overlay">
      <img id="full-size-dag-image" src="" alt="Full Size DAG Visualization" />
    </div>

    <script>
      async function loadDAG() {
        const response = await fetch("/dag");
        const { nodes } = await response.json();
        const dagElement = document.getElementById("dag");
        dagElement.innerHTML = "";
        nodes.forEach(node => {
          const nodeElement = document.createElement("div");
         nodeElement.className = "node";
          nodeElement.innerHTML = `<span class="node-name">${node.name}</span>
                <span class="node-subcat">Subcat: ${node.neighbors.length ? node.neighbors.join(", ") : "-"}</span>`;
          dagElement.appendChild(nodeElement);
        });
      }

      async function queryDAG(resultNodes) {
        const dagElement = document.getElementById("dag-query");
        dagElement.innerHTML = "";
        resultNodes.forEach(node => {
          const nodeElement = document.createElement("div");
         nodeElement.className = "node";
          nodeElement.innerHTML = `<span class="node-name">${node.name}</span>
                <span class="node-subcat">Subcat: ${node.neighbors.length ? node.neighbors.join(", ") : "-"}</span>`;
          dagElement.appendChild(nodeElement);
        });
      }

      function showErrorModal(message) {
        const modal = document.getElementById("errorModal");
        const modalBody = document.getElementById("error-modal-body");
        const closeBtn = modal.querySelector(".close");

        modalBody.textContent = message;
        modal.style.display = "block";

        closeBtn.onclick = () => modal.style.display = "none";
        window.onclick = (event) => {
          if (event.target === modal) {
            modal.style.display = "none";
          }
        };
      }

      function handleError(response) {
        console.log(response);
        if (!response.ok) {
            response.json().then(message => showErrorModal(message.error));
        }
        return response;
      }

      function reloadDagImage() {
        dagImage.src = "/dag/image?" + Date.now();
      }

      function to_list(inputString) {
        return inputString.split(",").map(cat => cat.trim()).filter(cat => cat !== "")
      }

      // Not every message is an error. A move that leaves an item in two
      // states, or a deletion that spared something, is news the person needs
      // without being told something went wrong.
      function showNotice(message) {
        const notice = document.getElementById("notice");
        notice.textContent = message;
        notice.style.display = message ? "block" : "none";
      }

      // Names are arbitrary text: `&`, `#` or `+` in one would otherwise split
      // the query string, truncate it, or arrive as a space. `,` and `|` are
      // separators, so they are encoded per-term and joined afterwards.
      function catParam(names) {
        return names.map(encodeURIComponent).join(",");
      }

      function queryParams() {
        return catParam(to_list(document.getElementById("query-categories").value));
      }

      const dagImage = document.getElementById("dag-image");
      const dagQueryImage = document.getElementById("dag-query-image");
      const fullSizeDagImage = document.getElementById("full-size-dag-image");
      const overlay = document.getElementById("image-overlay");

      dagImage.addEventListener("click", () => {
        fullSizeDagImage.src = dagImage.src;
        overlay.style.display = "flex";
      });

      dagQueryImage.addEventListener("click", () => {
            fullSizeDagImage.src = dagQueryImage.src;
            overlay.style.display = "flex";
        });

      overlay.addEventListener("click", (event) => {
        if (event.target === overlay) {
          overlay.style.display = "none";
        }
      });

      document.getElementById("add-item-form").addEventListener("submit", async (evt) => {
        evt.preventDefault();
        const subcategories = to_list(document.getElementById("subcategory").value);
        const superCats = to_list(document.getElementById("super-categories").value);
        await fetch("/dag/node", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({ subcategories, super_categories: superCats })
        }).then(response => handleError(response));
        await loadDAG();
        reloadDagImage();
      });

      document.getElementById("remove-item-button").addEventListener("click", async () => {
        const subcategories = to_list(document.getElementById("subcategory").value);
        await fetch("/dag/node", {
          method: "DELETE",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({ subcategories })
        }).then(response => handleError(response));
        await loadDAG();
        reloadDagImage();
      });

      document.getElementById("delete-cone-button").addEventListener("click", async () => {
        const names = to_list(document.getElementById("subcategory").value);
        if (!names.length) { return; }
        // Look before leaping: this is the destructive removal, and what it
        // spares (cone members that hang elsewhere too) is the part nobody
        // expects. The preview changes nothing.
        const params = names.map(n => "name=" + encodeURIComponent(n)).join("&");
        const preview = await fetch("/dag/removal?cone=1&" + params)
          .then(response => handleError(response));
        if (!preview.ok) { return; }
        const plan = await preview.json();
        const kept = plan.kept.length
          ? "\n\nKept (they hang elsewhere too): " + plan.kept.join(", ") : "";
        if (!window.confirm("Delete " + plan.deleted.length + " item(s): "
                            + plan.deleted.join(", ") + kept)) { return; }
        const response = await fetch("/dag/node?cone=1", {
          method: "DELETE",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({ subcategories: names })
        }).then(response => handleError(response));
        if (response.ok) {
          const result = await response.json();
          showNotice("Deleted " + result.deleted.join(", ")
            + (result.kept.length
               ? "; kept " + result.kept.join(", ") + " (filed elsewhere too)"
               : ""));
        }
        await loadDAG();
        reloadDagImage();
      });

      document.getElementById("move-item-form").addEventListener("submit", async (evt) => {
        evt.preventDefault();
        const subcategories = to_list(document.getElementById("subcategory").value);
        const to = to_list(document.getElementById("move-to").value);
        const from = to_list(document.getElementById("move-from").value);
        const response = await fetch("/dag/node", {
          method: "PATCH",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({ subcategories, to, from })
        }).then(response => handleError(response));
        if (response.ok) {
          const result = await response.json();
          // The contested set: items now under both an old and a new category,
          // which is true rather than broken (a shared item really is in both
          // situations) and which nothing here can decide for you.
          showNotice(result.contested.length
            ? "Moved. Still in both states: " + result.contested.join(", ")
            : "Moved.");
        }
        await loadDAG();
        reloadDagImage();
      });

      // Typed values need their dimension declared before they can be filed at
      // all, and until this button existed the only way to do that here was to
      // hand-create the three declaration nodes.
      document.getElementById("prelude-button").addEventListener("click", async () => {
        const response = await fetch("/dag/prelude", {method: "POST"})
          .then(response => handleError(response));
        if (response.ok) {
          const result = await response.json();
          showNotice("Dimensions declared (prelude v" + result.version
            + "): weight, time, size and friends are now usable.");
        }
        await loadDAG();
        reloadDagImage();
      });

      async function loadPacks() {
        const select = document.getElementById("pack-select");
        const { packs } = await fetch("/dag/pack").then(r => r.json());
        packs.forEach(pack => {
          const option = document.createElement("option");
          option.value = pack.name;
          option.textContent = pack.name + " (" + pack.declarations + ")";
          select.appendChild(option);
        });
      }

      document.getElementById("pack-button").addEventListener("click", async () => {
        const name = document.getElementById("pack-select").value;
        if (!name) { showNotice("Pick a pack first."); return; }
        const response = await fetch("/dag/pack", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({ name })
        }).then(response => handleError(response));
        if (response.ok) { showNotice("Adopted the " + name + " pack."); }
        await loadDAG();
        reloadDagImage();
      });

      document.getElementById("below-button").addEventListener("click", async () => {
        const sub = document.getElementById("below-sub").value.trim();
        const sup = document.getElementById("below-sup").value.trim();
        if (!sub || !sup) { showNotice("Give both a subject and a category."); return; }
        const response = await fetch("/dag/below?sub=" + encodeURIComponent(sub)
          + "&sup=" + encodeURIComponent(sup)).then(response => handleError(response));
        if (response.ok) {
          const { below } = await response.json();
          showNotice(sub + (below ? " fits within " : " does NOT fit within ") + sup);
        }
      });

      document.getElementById("canon-button").addEventListener("click", async () => {
        const term = document.getElementById("canon-term").value.trim();
        if (!term) { showNotice("Type a term to canonicalize."); return; }
        const response = await fetch("/dag/canon?term=" + encodeURIComponent(term))
          .then(response => handleError(response));
        if (response.ok) {
          const result = await response.json();
          showNotice(term + " is stored as " + result.canonical
            + (result.display !== result.canonical
               ? " (shown as " + result.display + ")" : ""));
        }
      });

      document.getElementById("new-dag-button").addEventListener("click", async () => {
        await fetch("/dag", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
        });
        await loadDAG();
        reloadDagImage();
      });

      document.getElementById("query-form").addEventListener("submit", async (evt) => {
        evt.preventDefault();
        const params = queryParams();
        const response = await fetch("/dag/query?cat=" + params, {
          method: "GET",
          headers: {"Content-Type": "application/json"},
        });
        const { nodes } = await response.json();
        await queryDAG(nodes);
        // Force-reload the image by appending a timestamp
        const dagQueryImage = document.getElementById("dag-query-image");
        dagQueryImage.src = "/dag/query/image?cat=" + params + "&" + Date.now();
        dagQueryImage.style.display = "block";
      });

      document.getElementById("import-file-form").addEventListener("submit", async (evt) => {
        evt.preventDefault();
        const formData = new FormData();
        const fileInput = document.getElementById("file-input");
        formData.append("file", fileInput.files[0]);

        await fetch("/dag/import", {
          method: "POST",
          body: formData
        }).then(response => handleError(response));

        await loadDAG();
        reloadDagImage();
      });

      document.getElementById("query-import-file-form").addEventListener("submit", async (evt) => {
        evt.preventDefault();
        const formData = new FormData();
        const fileInput = document.getElementById("query-file-input");
        formData.append("file", fileInput.files[0]);

        await fetch("/dag/query/import", {
          method: "POST",
          body: formData
        }).then(response => handleError(response))
          .then(response => response.json())
          .then(data => {
            const { nodes } = data;
            console.log(nodes);
            queryDAG(nodes);
          });

        const dagQueryImage = document.getElementById("dag-query-image");
        dagQueryImage.src = "/dag/query/dag/image";
        dagQueryImage.style.display = "block";
      });

      document.getElementById("export-dag-button").addEventListener("click", () => {
        window.location.href = "/dag/export";
      });
      document.getElementById("export-dag-omn-button").addEventListener("click", () => {
        window.location.href = "/dag/export/omn";
      });
      document.getElementById("export-dag-dot-button").addEventListener("click", () => {
        window.location.href = "/dag/export/dot";
      });
      document.getElementById("export-dag-tex-button").addEventListener("click", () => {
        window.location.href = "/dag/export/tex";
      });

      // The download is of the query on screen, not of whatever the session
      // last remembered — and it is the EXCERPT: the answer, never the query
      // terms, so re-importing it does not file the question as knowledge.
      function queryExportUrl(path) {
        const params = ["cat=" + queryParams()];
        if (document.getElementById("export-with-context").checked) {
          params.push("context=1");
        }
        return path + "?" + params.join("&");
      }

      document.getElementById("export-query-dag-button").addEventListener("click", () => {
        window.location.href = queryExportUrl("/dag/query/export");
      });
      document.getElementById("export-query-dag-omn-button").addEventListener("click", () => {
        window.location.href = queryExportUrl("/dag/query/export/omn");
      });
      document.getElementById("export-query-dag-dot-button").addEventListener("click", () => {
        window.location.href = queryExportUrl("/dag/query/export/dot");
      });
      document.getElementById("export-query-dag-tex-button").addEventListener("click", () => {
        window.location.href = queryExportUrl("/dag/query/export/tex");
      });

      window.onload = () => { loadDAG(); loadPacks(); };
    </script>
  </body>
</html>
