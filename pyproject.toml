[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ontodag"
version = "0.10.1"
description = "Associative memory and categories based on a directed acyclic graph data structure"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.11"
keywords = ["ontology", "knowledge-representation", "knowledge-graph", "concept-lattice", "fca", "formal-concept-analysis", "formal concept analysis", "pattern-structures", "concrete-domains", "dag", "taxonomy", "associative-memory", "swarm", "web3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "graphviz",
    "owlready2",
    "recordstore>=0.16.0",  # prove/verify_proof (is_below certificates consume them)
]

[project.optional-dependencies]
web = ["flask", "dot2tex", "Pillow"]
# The `swarm:NAME` CLI backend talks to a Bee node via recordstore's
# BeeBytesStore (needs `requests`, recordstore's [bee] extra); resolves the
# postage batch with the default `bee_batch = auto` (needs `swarmfs`, the
# [stamps] extra — without it every command on a swarm store fails at
# store-open, since selection happens in BeeBytesStore's constructor); and —
# when a signer is configured — publishes the latest root to a Swarm feed via
# SwarmFeedPointer (needs `swarm-bee`, the [feeds] extra). Declare all three
# through recordstore so the versions stay in step with it. (Historical note:
# the [stamps] extra is why the floor was once pinned at 0.14.0 — it does not
# exist earlier, and pip only warns on unknown extras; the floor is 0.16.0
# now because ontodag.certificates consumes prove/verify_proof.)
swarm = ["recordstore[bee,feeds,stamps]>=0.16.0"]
test = ["pytest"]

[project.scripts]
odag = "ontodag.__main__:main"
odag-mcp = "ontodag.mcp:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/petfold/ontodag"
Repository = "https://github.com/petfold/ontodag"
Issues = "https://github.com/petfold/ontodag/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
# testdag.py/testitem.py/testowl.py predate the test_*.py convention and are
# silently skipped by pytest's default discovery pattern without this.
python_files = ["test*.py"]
