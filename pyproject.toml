[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ontodag"
version = "0.18.0"
description = "Associative memory and categories based on a directed acyclic graph data structure"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.11"
keywords = ["ontology", "knowledge-representation", "knowledge-graph", "concept-lattice", "fca", "formal-concept-analysis", "formal concept analysis", "pattern-structures", "concrete-domains", "dag", "taxonomy", "associative-memory", "swarm", "web3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]
# Nothing. The core data structure, the CLI, the native text store and the
# dimension arithmetic are standard library only, and the B1 boundary
# (tests/test_boundaries.py) exists to keep them that way — a promise that
# was true in the code but not in this list until 2026-08-02, when a bare
# `pip install ontodag` still pulled 31 MB, a compiled extension and two
# bundled Java reasoners for a 648 KB package.
#
# Consequences worth keeping: no C toolchain is needed to install this, so
# it works in slim containers and on embedded targets; and the wheel is
# pure-Python with a pure-Python closure, which is what makes it installable
# in a browser under Pyodide (micropip cannot build sdists, and owlready2
# ships sdist-only — that single hard dependency blocked the whole
# in-browser story).
#
# The one exception is `recordstore`, and it is worth stating the criterion
# it passes rather than treating it as a favour: 184 KB, *no dependencies of
# its own*, pure Python, no compiled extension — so it costs nothing an
# embedded or browser target cares about. What it buys is that the
# properties OntoDAG is actually for — canonical roots, snapshots,
# certificates, the agent surface — work on a bare install instead of
# hiding behind an extra. A dependency that changes what the package *is*
# by default earns its place; one that adds 28 MB of Java reasoners for a
# file format does not.
dependencies = ["recordstore>=0.20.0"]

[project.optional-dependencies]
# Rendering. The `graphviz` PyPI package is only a wrapper: the `dot`
# binary has to come from your OS (apt/brew install graphviz). Pillow is
# needed only by generate_image(), which returns an image object; writing
# a file and emitting DOT source both work without it.
viz = ["graphviz", "Pillow"]
# OWL and Manchester import/export. By far the heaviest thing here — it
# bundles Java reasoners OntoDAG never invokes — which is exactly why it
# is opt-in.
owl = ["owlready2"]
# Kept as an alias now that recordstore is a base dependency, so that
# `pip install "ontodag[store]"` (and the error messages that suggest it
# on a broken install) keep working.
store = ["recordstore>=0.20.0"]
# Encrypted rs: stores (the `store_key` setting): AES-SIV via pycryptodome.
crypto = ["pycryptodome"]
web = ["ontodag[viz,owl]", "flask", "dot2tex"]
# The `swarm:NAME` CLI backend talks to a Bee node via recordstore's
# BeeBytesStore (needs `requests`, recordstore's [bee] extra); resolves the
# postage batch with the default `bee_batch = auto` (needs `swarmfs`, the
# [stamps] extra — without it every command on a swarm store fails at
# store-open, since selection happens in BeeBytesStore's constructor); and —
# when a signer is configured — publishes the latest root to a Swarm feed via
# SwarmFeedPointer (needs `swarm-bee`, the [feeds] extra). Declare all three
# through recordstore so the versions stay in step with it. (Historical note:
# the [stamps] extra is why the floor was once pinned at 0.14.0 — it does not
# exist earlier, and pip only warns on unknown extras; the floor is 0.16.0
# now because ontodag.certificates consumes prove/verify_proof.)
# both Swarm use cases: local-first store dirs that sync in the background
# (the swarm: backend since 0.15) and direct-on-Swarm (feed publication,
# batch "auto"). recordstore 0.19 renamed/bundled its extras accordingly.
swarm = ["recordstore[swarm-only,local-first-swarm]>=0.20.0"]
# Everything, and it means everything: `all` is a promise about coverage, not
# a curated selection. Leaving `swarm` out made it a lie about the one feature
# this project is most about, and left the reader to notice that `[all]` still
# could not reach a Bee node. It is heavier than the rest (`swarm-bee` brings
# compiled coincurve/pycryptodome) — which is an argument for the base install
# staying lean and for the narrow extras existing, not for `all` under-
# delivering. Targets that cannot take a compiler (Pyodide, embedded) ask for
# what they need; `test` deliberately stays without `swarm`, so CI keeps
# proving the suite passes when Swarm is absent.
all = ["ontodag[viz,owl,store,swarm,web]"]
test = ["pytest", "ontodag[viz,owl,store]"]

[project.scripts]
odag = "ontodag.__main__:main"
odag-mcp = "ontodag.mcp:main"
odag-web = "ontodag.web:main"

[tool.setuptools.packages.find]
where = ["src"]

# The page, and only the page. `cars/` — the car-market demo — is
# deliberately absent: 3.1 MB of photographs that everyone who ever
# `pip install ontodag` would pay for, including the base install this
# project keeps pure and small and any future in-browser target. It ships
# with the repository, and /market says so when it is not there.
[tool.setuptools.package-data]
"ontodag.web" = ["templates/*.html", "static/*.css", "static/*.js",
                 "static/vendor/*.js", "static/vendor/*.md"]

[project.urls]
Homepage = "https://github.com/petfold/ontodag"
Repository = "https://github.com/petfold/ontodag"
Issues = "https://github.com/petfold/ontodag/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
# testdag.py/testitem.py/testowl.py predate the test_*.py convention and are
# silently skipped by pytest's default discovery pattern without this.
python_files = ["test*.py"]
