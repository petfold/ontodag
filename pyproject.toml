[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ontodag"
version = "0.2.0"
description = "Associative memory and categories based on a directed acyclic graph data structure"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "graphviz",
    "owlready2",
    "recordstore>=0.13.1",  # swarm_store() and RecordStore.blobs live here
]

[project.optional-dependencies]
web = ["flask", "dot2tex", "Pillow"]
# The `swarm:NAME` CLI backend talks to a Bee node via recordstore's
# BeeBytesStore (needs `requests`, recordstore's [bee] extra) and — when a
# signer is configured — publishes the latest root to a Swarm feed via
# SwarmFeedPointer (needs `swarm-bee`, recordstore's [feeds] extra). Declare
# both through recordstore so the versions stay in step with it.
swarm = ["recordstore[bee,feeds]>=0.12"]

[project.scripts]
odag = "ontodag.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
