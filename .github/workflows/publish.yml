name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # tests/testdag.py renders with Graphviz and dot2tex: the `graphviz` PyPI
      # package is only a wrapper, the `dot` binary has to come from apt, and
      # dot2tex lives in the [web] extra.
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: pip install -e ".[test,web]"
      # A v* tag publishes irreversibly — PyPI never allows re-uploading a
      # version, only yanking. Run the suite first so a tag cannot ship a red
      # build (ontodag-fs 0.0.1 shipped broken for exactly this reason).
      - run: pytest
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing (OIDC) — no API token stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
