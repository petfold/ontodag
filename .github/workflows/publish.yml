name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # tests/testdag.py renders with Graphviz and dot2tex: the `graphviz` PyPI
      # package is only a wrapper, the `dot` binary has to come from apt, and
      # dot2tex lives in the [web] extra. scripts/release_smoke.py needs the
      # same `dot` binary, in the venv it builds.
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: pip install -e ".[test,web]"

      # The tag names the release; pyproject decides what actually gets
      # uploaded. If they disagree, a `v0.10.2` tag quietly publishes 0.10.1
      # — and PyPI never lets you take a version back, only yank it.
      - name: Tag matches the version in pyproject
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$project" ]; then
            echo "tag $GITHUB_REF_NAME says $tag, pyproject says $project" >&2
            exit 1
          fi
          echo "both say $project"

      # A v* tag publishes irreversibly — PyPI never allows re-uploading a
      # version, only yanking. Run the suite first so a tag cannot ship a red
      # build (ontodag-fs 0.0.1 shipped broken for exactly this reason).
      - run: pytest
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*

      # ...and the suite is not enough on its own. 0.10.0 shipped unable to
      # draw any DAG containing a typed date with every check above green,
      # because they all test the source and none of them use the artifact.
      # This installs the built wheel into a throwaway venv and drives `odag`
      # end to end. It fails on the published 0.10.0.
      - name: Smoke-test the built wheel
        run: python scripts/release_smoke.py --wheel dist/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing (OIDC) — no API token stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Tolerate a version PyPI already has instead of failing the run.
          # Needed because 0.8.0-0.10.1 were uploaded by hand while this
          # workflow sat unused, so re-tagging any of them retroactively
          # would otherwise red-fail on the duplicate. The trade-off is that
          # a no-op upload now reports success, so treat the job passing as
          # "PyPI has this version", not "this run put it there" — the
          # authority on that is `release_smoke.py --pypi VERSION`.
          skip-existing: true

  verify:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      # Verify what PyPI serves, not what we built — the two are only the
      # same if the upload actually happened. The index takes a moment to
      # propagate after an upload, hence the retry; the script fails on a
      # version mismatch rather than testing the previous release quietly.
      - name: Smoke-test what PyPI serves
        run: |
          version="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5; do
            if python scripts/release_smoke.py --pypi "$version"; then
              exit 0
            fi
            echo "attempt $attempt failed; waiting for the index" >&2
            sleep 30
          done
          exit 1
